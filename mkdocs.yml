site_name: SSSN
site_description: Protocol and service layer for semantic channels, built on LLLM.
site_url: https://sssn.one/
repo_name: Productive-Superintelligence/sssn
repo_url: https://github.com/Productive-Superintelligence/sssn
edit_uri: edit/main/docs/
copyright: '<a class="psi-footer-brand" href="https://sssn.one/"><span class="psi-footer-wordmark" aria-hidden="true"></span><span class="psi-footer-text">SSSN</span></a>'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Newsreader
    code: Space Mono
  palette:
    - scheme: default
      primary: white
      accent: black
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_if_no_docstring: false
            filters: ["!^_"]
            heading_level: 3

hooks:
  - scripts/docs_hooks.py

validation:
  links:
    anchors: warn  # a link to a missing #heading fails the strict build

nav:
  - Get started:
      - Introduction: index.md
      - Installation: install.md
      - How SSSN works: concepts.md
  - Guide:
      - Channels and events: channels.md
      - Artifacts and snapshots: artifacts.md
      - Subscriptions: subscriptions.md
      - Stores: stores.md
      - Over HTTP: http.md
      - Processing with tactics: processing.md
      - Packages and refs: packages.md
  - Examples:
      - examples/index.md
      - An order pipeline: examples/order-pipeline.md
      - Processes sharing a store: examples/shared-store.md
  - API reference:
      - api/index.md
      - CLI: api/cli.md
      - HTTP API: api/http-api.md

extra:
  generator: false
  homepage: https://sssn.one/
  current_doc: sssn
  docs_switch:
    - key: lllm
      title: LLLM
      url: https://lllm.one/
    - key: sssn
      title: SSSN
      url: https://sssn.one/
    - key: aaax
      title: AAAX
      url: https://aaax.one/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Productive-Superintelligence/sssn

extra_css:
  - stylesheets/custom.20260702.css

extra_javascript:
  - javascripts/vendor/mermaid.min.js
  - javascripts/mermaid-init.20260629.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
