[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sssn"
version = "0.2.1"
description = "Protocol and service layer for semantic channels, built on LLLM."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "lllm-core>=0.4",
    "pydantic>=2.7",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # pymdown-extensions 12.2 needs mkdocstrings 1.0.8, which needs Python 3.11.
    "pymdown-extensions<12.2; python_version < '3.11'",
]
dev = [
    "pytest>=8.0",
    "pytest-examples>=0.0.15",
    "build>=1.2",
    "twine>=5.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
client = ["httpx>=0.27"]
all = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
sssn = "sssn.cli:main"

# Installing sssn adds `lllm network` to the lllm command.
[project.entry-points."lllm.commands"]
network = "sssn.cli"

[project.urls]
Homepage = "https://github.com/Productive-Superintelligence/sssn"
Documentation = "https://sssn.one/"
Source = "https://github.com/Productive-Superintelligence/sssn"
Issues = "https://github.com/Productive-Superintelligence/sssn/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sssn*"]

[tool.setuptools.package-data]
sssn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
